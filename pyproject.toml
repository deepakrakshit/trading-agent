[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-paper-trader"
version = "0.1.0"
description = "Local, audited, paper-only numerical reinforcement learning for NSE-style equities"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "torch==2.10.0",
  "numpy==2.4.2",
  "gymnasium==1.2.3",
  "pandas==3.0.0",
  "pyarrow==23.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
paper-trader = "trading_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
